version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions workflows (agar .github/workflows me koi CI hai)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker (Dockerfile hai project me)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
